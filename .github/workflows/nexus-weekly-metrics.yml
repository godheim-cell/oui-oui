name: Nexus weekly metrics

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python scripts/nexus.py status
      - run: python scripts/nexus.py audit || true
      - uses: actions/upload-artifact@v4
        with:
          name: nexus-weekly-report
          path: reports/
