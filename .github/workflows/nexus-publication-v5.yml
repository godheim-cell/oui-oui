name: Nexus V5 publication

on:
  workflow_dispatch:
    inputs:
      volume:
        description: "Volume à matérialiser (ex. tome-01)"
        required: true
        default: "tome-01"

permissions:
  contents: read

jobs:
  publication:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Install LibreOffice and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice-writer fonts-liberation
      - name: Build DOCX and PDF
        env:
          VOLUME: ${{ inputs.volume }}
        run: python scripts/publication.py --volume "$VOLUME" --pdf
      - name: Upload publication artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nexus-${{ inputs.volume }}-publication
          path: publication/${{ inputs.volume }}/
