name: Migration fonctionnelle Nexus V5

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/migrate-nexus-v5.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout oui-oui
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Récupérer Nexus V5
        run: |
          git clone --depth 1 https://github.com/godheim-cell/Nexus.git /tmp/Nexus

      - name: Copier Nexus V5 intégralement
        run: |
          rsync -a --delete --exclude '.git/' /tmp/Nexus/ ./

      - name: Spécialiser la configuration Oui-Oui
        run: |
          cat > config/projet.toml <<'EOF'
          [project]
          title = "Oui-Oui en vacances au Pays Enchanté"
          subtitle = ""
          author = "Patrick Meslin"
          language = "fr"
          genre = "album jeunesse illustré"
          intention = "Un voyage joyeux, rassurant et participatif autour de l'amitié, de la découverte et de l'entraide."
          series = "Oui-Oui"
          volume = 1
          status = "development"
          author_mode = "essential"

          [manuscript]
          root = "manuscrit"
          active_volume = "tome-01"
          manifest = "manuscrit/tome-01/manifest.txt"
          output = "publication/manuscrit.md"
          scene_prefix = "SCN"

          [quality]
          minimum_scene_words = 20
          maximum_scene_words = 220
          require_scene_change = true
          require_reader_hook = true
          require_pov = true
          require_time = false
          require_location = true
          forbid_placeholder_in_canon = true
          max_author_priorities = 5

          [author]
          cockpit = "COCKPIT_AUTEUR.md"
          checkpoint = "data/checkpoint.json"
          revision_dir = "reports/revisions"
          auto_add_new_scene_to_manifest = true
          allow_unknown = true

          [governance]
          canon_file = "data/canon.yml"
          decisions_dir = "decisions"
          research_is_non_canon = true
          ai_context_is_derived = true

          [publication]
          page_width_cm = 21.0
          page_height_cm = 21.0
          margin_top_cm = 1.2
          margin_bottom_cm = 1.2
          margin_left_cm = 1.2
          margin_right_cm = 1.2
          font = "Liberation Serif"
          font_size_pt = 14.0
          EOF

      - name: Ajouter le dossier projet
        run: |
          cat > docs/14_PROJET_OUI_OUI.md <<'EOF'
          # Projet — Oui-Oui en vacances au Pays Enchanté

          ## Cible
          Album illustré jeunesse, 3–6 ans.

          ## Concept
          Oui-Oui part en vacances dans sa petite voiture jaune et rouge pour rendre visite à ses amis du Manège Enchanté. Sur la route, il traverse des paysages magiques, rencontre Zébulon et Pollux, puis retrouve Margote et Florence. Les petites péripéties sont toujours rassurantes et se résolvent par l'observation, la politesse, le jeu ou l'entraide.

          ## Piliers
          - amitié ;
          - découverte ;
          - entraide ;
          - imagination ;
          - voyage ;
          - participation légère du jeune lecteur.

          ## Ton
          Doux, joyeux, coloré, musical et rassurant.

          ## Format narratif initial
          12 pages/scènes, extensible à 14 après contrôle du rythme et de la maquette.
          EOF

          cat > README.md <<'EOF'
          # Oui-Oui en vacances au Pays Enchanté

          Projet d'album illustré jeunesse 3–6 ans construit sur le moteur **Nexus V5**.

          Le dépôt conserve l'architecture, les scripts, les tests, les workflows, les registres et les règles de gouvernance de Nexus V5. Les éléments éditoriaux sont spécialisés pour l'album Oui-Oui.

          ## Point d'entrée
          - `docs/14_PROJET_OUI_OUI.md` : concept actif
          - `COCKPIT_AUTEUR.md` : cockpit auteur
          - `data/` : registres narratifs
          - `manuscrit/tome-01/` : album actif
          - `recherches/` : recherches externes
          - `atelier/` : travail éditorial et lectures externes
          EOF

      - name: Commit de migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Aucun changement à committer"
          else
            git commit -m "Importer Nexus V5 complet et initialiser Oui-Oui"
            git push origin HEAD:main
          fi
