# V4 — modèle générique d'expérience lecteur.
#
# Les seuils par défaut sont définis dans scripts/continuity.py :
# - max_active_mysteries: 4
# - max_new_concepts: 3
# - max_new_names: 4
# - max_new_rules: 2
# - max_major_revelations: 1
# - max_load_score: 8
#
# Un projet dérivé peut ajouter une section `thresholds:` pour les surcharger.
# Nexus conserve volontairement les valeurs par défaut et aucune référence de projet.

principles:
  single_dominant_question: true
  abstraction_requires_incarnation: true
  revelation_requires_assimilation: true
  hierarchy_over_quantity: true
  beta_convergence_before_rewrite: true

project_guardrails: {}
